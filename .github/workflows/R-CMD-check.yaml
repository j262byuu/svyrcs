on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # CRAN builds the PDF manual, so one job has to. Rd markup errors surface nowhere else --
          # not in the HTML manual, not in the Rd checks -- and until 0.6.2 no job here built it.
          - {os: ubuntu-latest,  r: 'release', manual: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # V8 only on the manual job: without it the HTML manual check NOTEs with "Skipping checking
          # math rendering", and this package's help does contain \eqn{} markup.
          extra-packages: ${{ matrix.config.manual && 'any::rcmdcheck, any::V8' || 'any::rcmdcheck' }}
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      # TinyTeX's base install omits makeindex, which Rd2pdf needs. Without it the manual compiles
      # and then fails at the index step, which reads like an Rd problem but is not.
      - name: Install the LaTeX packages Rd2pdf needs
        if: matrix.config.manual
        run: tlmgr install makeindex inconsolata times helvetic dejavu

      # Dropping --no-manual re-enables the HTML manual check as well as the PDF one, and that step
      # NOTEs without HTML Tidy. CRAN's machines have it, so install it rather than tolerate the
      # NOTE -- the point of this job is to check what CRAN checks.
      - name: Install HTML Tidy for the HTML manual check
        if: matrix.config.manual
        run: sudo apt-get update && sudo apt-get install -y tidy

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The action's default drops the manual on every job. Keep it only where LaTeX was
          # installed above.
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # A green job is not evidence the manual was built: reinstate --no-manual, or lose the LaTeX
      # install, and this job goes on passing while silently skipping the step it exists for. That
      # is exactly how the no-ggplot2 job below was found to be testing nothing.
      - name: Confirm the PDF manual really was built
        if: matrix.config.manual
        run: |
          log <- list.files(".", "^00check[.]log$", recursive = TRUE, full.names = TRUE)
          if (length(log) != 1) stop("expected exactly one 00check.log, found ", length(log))
          txt <- readLines(log, warn = FALSE)
          for (what in c("PDF", "HTML")) {
            hit <- grep(paste("checking", what, "version of manual"), txt, value = TRUE)
            if (!length(hit)) {
              stop("the check log has no '", what, " version of manual' line, so it was skipped")
            }
            if (!any(grepl("OK", hit))) {
              stop("the ", what, " manual step did not pass: ", paste(hit, collapse = "; "))
            }
            cat(hit, sep = "\n")
          }
        shell: Rscript {0}

  # ggplot2 is a Suggests, and plot() is meant to fall back to base graphics without it. The matrix
  # above cannot verify that, because setup-r-dependencies installs Suggests -- every run there has
  # ggplot2 present and every ggplot2 test passes rather than skipping. This job installs the hard
  # dependencies plus only what the test suite itself needs, so the fallback runs for real.
  without-ggplot2:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no ggplot2)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Without this, R CMD check refuses to run at all when a Suggests package is missing, which is
      # exactly the situation this job exists to create.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # Caching must be off here. The cache key falls back to an os-and-R-version prefix, so
          # this job would restore the matrix jobs' library -- which has every Suggests in it,
          # ggplot2 included -- and quietly stop testing what it exists to test. The dependency
          # resolution is correct either way; it is the restored library that is the problem.
          cache: false
          extra-packages: >
            any::rcmdcheck,
            any::testthat,
            any::knitr,
            any::rmarkdown,
            any::survival,
            any::mitools

      - name: Confirm ggplot2 really is absent
        run: |
          if (requireNamespace("ggplot2", quietly = TRUE)) {
            stop("ggplot2 is installed, so this job is not testing what it claims to test")
          }
          cat("ggplot2 absent, as intended\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
